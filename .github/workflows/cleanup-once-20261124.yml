name: One-time approved Actions and obsolete-branch cleanup (2026-11-24)

# Authorized maintenance operation. Runs only when this workflow is first
# added to main by the exact approved squash commit. Does NOT run on later
# source changes and never touches tags or GitHub Release assets.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-once-20261124.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: cybergladiatorsfix-storage-cleanup-20261124
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.repository == 'legluondunet/CyberGladiatorsFix' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'maintenance: execute approved CyberGladiatorsFix cleanup 2026-11-24')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate safety guards and remove only inventoried obsolete branches
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          default="$(gh api "repos/$repo" --jq '.default_branch')"
          [[ "$default" == "main" ]] || { echo "::error::Default branch changed"; exit 1; }
          open_prs="$(gh api --paginate "repos/$repo/pulls?state=open&per_page=100" --jq '.[].number')"
          [[ -z "$open_prs" ]] || { echo "::error::Open PRs, refusing any branch deletion: $open_prs"; exit 1; }
          gh api --paginate "repos/$repo/branches?per_page=100" \
            --jq '.[] | [.name, .protected] | @tsv' > "${RUNNER_TEMP}/branches.tsv"
          protected="$(awk -F '\t' '$1 != "main" && $2 == "true" {print $1}' "${RUNNER_TEMP}/branches.tsv")"
          [[ -z "$protected" ]] || { echo "::error::Protected non-main branches: $protected"; exit 1; }

          # Fail closed if unexpected new branches exist; delete only reviewed
          # obsolete branches, never tag refs and never any unnamed ref.
          allowed=(
            'audit/v2-glide-effect-inventory'
            'cleanup/pre-release-remove-legacy-nglide'
            'docs/add-readme-screenshots'
            'docs/credit-legluondunet-chatgpt'
            'docs/generic-cue-bin-install-example'
            'docs/readme-badges-credit-footer'
            'docs/rename-windows-build-badge'
            'docs/replace-right-screenshot-purple'
            'docs/supported-game-editions-sha256'
            'docs/v2-native-fr-main-smoke'
            'docs/v2-native-us-main-smoke'
            'docs/v2-windows-fr-field-check'
            'docs/v2.0.0-final-release-audit'
            'docs/v2.0.0-public-release-copy'
            'docs/v2.0.0-release-acceptance'
            'feat/unified-clean-install-layout'
            'feature/launch-no-verify-cli-cleanup'
            'feature/separate-launcher-and-runtime-logs'
            'fix/avi-console-foreground'
            'fix/cleanup-legacy-windows-action-runs'
            'fix/fr-conditional-intro-guard'
            'fix/ge-proton-avi-host-ownership'
            'fix/ge-proton-avi-initial-remap'
            'maintenance/clear-actions-and-obsolete-branches-20261124'
            'release/prepare-v1.0.1'
            'release/v2.0.0-prep'
            'release/v2.0.1-audit-docs'
          )
          mapfile -t actual < <(cut -f 1 "${RUNNER_TEMP}/branches.tsv" | grep -v '^main$')
          for found in "${actual[@]}"; do
            valid=false
            for approved in "${allowed[@]}"; do
              if [[ "$found" == "$approved" ]]; then valid=true; break; fi
            done
            [[ "$valid" == true ]] || { echo "::error::Unexpected branch $found; aborting"; exit 1; }
          done

          removed=0
          for target in "${allowed[@]}"; do
            if printf '%s\n' "${actual[@]}" | grep -Fxq -- "$target"; then
              gh api --method DELETE "repos/$repo/git/refs/heads/$target" >/dev/null
              echo "Deleted obsolete branch: $target"
              removed=$((removed + 1))
            fi
          done
          echo "BRANCHES_DELETED=$removed" >> "$GITHUB_ENV"
          echo "Deleted $removed obsolete branches; protected main and tags untouched"

      - name: Purge completed Actions runs and temporary artifacts, not releases
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          # Snapshot ALL pages before deletion, so pagination cannot shift.
          gh api --paginate "repos/$repo/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | .id' > "${RUNNER_TEMP}/completed-runs.txt"
          deleted=0
          while IFS= read -r run_id; do
            [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "::error::Malformed run ID"; exit 1; }
            [[ "$run_id" != "$GITHUB_RUN_ID" ]] || { echo "::error::Refusing self-deletion"; exit 1; }
            gh api --method DELETE "repos/$repo/actions/runs/$run_id" >/dev/null
            echo "Deleted completed Actions run: $run_id"
            deleted=$((deleted + 1))
            sleep 0.2
          done < "${RUNNER_TEMP}/completed-runs.txt"
          echo "RUNS_DELETED=$deleted" >> "$GITHUB_ENV"

      - name: Verify cleanup and report
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[].name' > "${RUNNER_TEMP}/remaining-branches.txt"
          if [[ "$(cat "${RUNNER_TEMP}/remaining-branches.txt")" != "main" ]]; then
            echo "::error::Unexpected branches remain; inspect repository"
            exit 1
          fi
          echo "## Approved repository storage cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deleted obsolete branches: ${BRANCHES_DELETED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deleted completed Actions runs: ${RUNS_DELETED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Remaining branch: main" >> "$GITHUB_STEP_SUMMARY"
          echo "- Releases and git tags: not modified" >> "$GITHUB_STEP_SUMMARY"
          echo "- This cleanup run and any concurrent CI runs remain in Actions history" >> "$GITHUB_STEP_SUMMARY"
