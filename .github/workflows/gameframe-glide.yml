name: CyberGladiatorsFix - Windows x64 one-file pre-release checks

on:
  # Run the complete release build for every change, not just selected paths.
  # This covers license, toolchain, packaging, CI and metadata updates too.
  push:
    branches: [main]
    tags: ['v*']  # Build release tags; do not publish GitHub Releases automatically.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameframe-glide:
    name: Windows x64 one-file GameFrame validation
    runs-on: windows-latest
    steps:
      - name: Check out CyberGladiatorsFix
        uses: actions/checkout@v4
        with:
          # Use the reviewed source commit, not GitHub's temporary PR merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out pinned upstream GameFrame
        uses: actions/checkout@v4
        with:
          repository: tanepiper/game-frame
          ref: f195a074a63cc150673c38becdec696163b0b3d1
          path: third_party/game-frame
          persist-credentials: false

      - name: Verify release tag matches Cargo package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content 'Cargo.toml' -Raw
          if ($manifest -notmatch '(?m)^version\s*=\s*"([^"]+)"\s*$') { throw 'Cargo.toml version missing' }
          $tag = $env:GITHUB_REF_NAME
          if ($tag -cne "v$($Matches[1])") { throw "Tag $tag differs from Cargo.toml version v$($Matches[1])" }
          Write-Host "Version tag matched: $tag"

      - name: Install 32-bit Windows Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc, x86_64-pc-windows-msvc

      - name: Apply narrow Cyber Gladiators adaptations to pinned GameFrame sources
        shell: pwsh
        run: |
          python tools/gameframe/patch_gameframe.py third_party/game-frame
          if ($LASTEXITCODE -ne 0) { throw "GameFrame integration patch failed; upstream source drift?" }
          python tools/gameframe/patch_fullscreen.py third_party/game-frame
          if ($LASTEXITCODE -ne 0) { throw "GameFrame fullscreen stabilization patch failed; upstream source drift?" }
          python tools/gameframe/patch_first_present.py third_party/game-frame
          if ($LASTEXITCODE -ne 0) { throw "GameFrame first GL present patch failed; upstream source drift?" }
          python tools/gameframe/patch_menu_signature.py third_party/game-frame
          if ($LASTEXITCODE -ne 0) { throw "GameFrame menu signature patch failed; upstream source drift?" }

      - name: Compile upstream Glide wrapper using MSVC and decorated Win32 exports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = (Resolve-Path 'third_party/game-frame/wrappers/Cargo.toml').Path
          $upstreamDef = (Resolve-Path 'third_party/game-frame/wrappers/glide/glide2x.def').Path
          # GNU/MinGW uses an internal grGlideInit@0 COFF symbol while the
          # 32-bit MSVC target uses _grGlideInit@0. Preserve the original
          # exported names, changing ONLY the internal alias on the right.
          $def = Join-Path $env:RUNNER_TEMP 'gameframe-glide-msvc.def'
          $original = Get-Content -Raw $upstreamDef
          $converted = [regex]::Replace($original, '(?m)^(_[A-Za-z0-9_]+@\d+)=(\w+@\d+)\r?$', '$1=_$2')
          $n = ([regex]::Matches($converted, '(?m)^_[A-Za-z0-9_]+@\d+=_[A-Za-z0-9_]+@\d+\r?$')).Count
          if ($n -ne 156) { throw "Expected 156 adapted Glide symbols; got $n" }
          Set-Content -Path $def -Value $converted -Encoding ascii
          $env:RUSTFLAGS = "-C link-arg=/DEF:$def"
          cargo build -p glide --release --target i686-pc-windows-msvc --manifest-path $manifest
          if ($LASTEXITCODE -ne 0) { throw "GameFrame Glide Windows x86 MSVC compilation failed" }

      - name: Check PE32 machine, DLL exports and Glide 2.11 compatibility
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pefile
          if ($LASTEXITCODE -ne 0) { throw "PE analysis setup failed" }
          $dll = 'third_party/game-frame/wrappers/target/i686-pc-windows-msvc/release/glide2x.dll'
          python tools/gameframe/audit_exports.py $dll third_party/game-frame/wrappers/glide/glide2x.def
          if ($LASTEXITCODE -ne 0) { throw "GameFrame DLL export check failed" }

      - name: Build matching standalone GameFrame x64 launcher and embedded x86 WinMM bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = 'third_party/game-frame/wrappers/target/i686-pc-windows-msvc/release/glide2x.dll'
          $env:CYBER_GAMEFRAME_GLIDE_SHA256 = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $env:CYBER_GAMEFRAME_GLIDE_DLL_PATH = (Resolve-Path $dll).Path
          cargo build --release --target i686-pc-windows-msvc --manifest-path cdda/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Failed to build embedded WinMM bridge" }
          cargo test --target i686-pc-windows-msvc --manifest-path cdda/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "WinMM bridge tests failed" }
          cargo build --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "GameFrame launcher build failed" }
          cargo test --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "GameFrame launcher unit tests failed" }
          & 'target/x86_64-pc-windows-msvc/release/CyberGladiatorsFix.exe' --help
          if ($LASTEXITCODE -ne 0) { throw "GameFrame help smoke failed" }
          & 'target/x86_64-pc-windows-msvc/release/CyberGladiatorsFix.exe' --check-bundle
          if ($LASTEXITCODE -ne 0) { throw "Embedded WinMM/GameFrame bundle mismatch" }
          $output = (& 'target/x86_64-pc-windows-msvc/release/CyberGladiatorsFix.exe' --check-bundle | Out-String)
          if ($output -notmatch 'open_source_glide_embedded=1') { throw "GameFrame must be embedded into the one EXE" }
          Write-Host "Matched GameFrame Glide SHA256=$env:CYBER_GAMEFRAME_GLIDE_SHA256"

      - name: Check version and strict no-install verification preserve the one-session log
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = (Resolve-Path 'target/x86_64-pc-windows-msvc/release/CyberGladiatorsFix.exe').Path
          $sourceSha = (git rev-parse --short=8 HEAD).Trim()
          $version = (& $exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or !$version.EndsWith("-$sourceSha")) {
            throw "Version does not identify the checked-out source commit: version=$version source=$sourceSha"
          }
          & $exe --verify 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'Strict --verify unexpectedly succeeded without retail assets' }
          $log = Join-Path (Split-Path -Parent $exe) 'CyberGladiatorsFix.log'
          if (!(Test-Path $log)) { throw 'Strict --verify failed without a session log' }
          $body = Get-Content -Raw $log
          foreach ($part in @('[SESSION] BEGIN', '[SYSTEM]', '[CONFIG]', '[SESSION] END failure')) {
            if (!$body.Contains($part)) { throw "Unified log missing: $part" }
          }
          $hash = (Get-FileHash $log -Algorithm SHA256).Hash
          & $exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Help smoke test failed' }
          if ((Get-FileHash $log -Algorithm SHA256).Hash -ne $hash) {
            throw '--help unexpectedly changed the prior unified session log'
          }
          Write-Host 'Strict verify + one log + read-only help: PASS'
          exit 0

      - name: Check FR CUE inspection does not install or patch anything
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = (Resolve-Path 'target/x86_64-pc-windows-msvc/release/CyberGladiatorsFix.exe').Path
          $dir = Split-Path -Parent $exe
          $cue = Join-Path $env:RUNNER_TEMP 'cyber-fr-cue-fixture.cue'
          @'
          FILE "CYBERG.BIN" BINARY
            TRACK 01 MODE1/2352
              INDEX 01 00:00:00
            TRACK 02 AUDIO
              PREGAP 00:02:00
              INDEX 01 07:09:65
            TRACK 03 AUDIO
              INDEX 00 08:29:68
              INDEX 01 08:31:68
          '@ | Set-Content $cue -Encoding ascii
          $output = (& $exe --inspect-disc $cue 2>&1 | Out-String)
          if ($LASTEXITCODE -eq 0) {
            throw 'Inspection succeeded without CYBERG.BIN; missing image must be reported'
          }
          $log = Join-Path $dir 'CyberGladiatorsFix.log'
          if (!(Test-Path $log)) { throw 'Inspection failed without unified session log' }
          $body = Get-Content -Raw $log
          foreach ($part in @('DISC_INSPECT', 'tracks=3 audio_tracks=2', 'DISC_TRACK number=03', '[SESSION] END failure')) {
            if (!$body.Contains($part)) { throw "Inspection log missing: $part" }
          }
          if (Test-Path (Join-Path $dir 'CyberGladiatorsFix')) {
            throw 'Read-only inspection unexpectedly installed a game directory'
          }
          if (Test-Path (Join-Path $dir 'CyberGladiatorsFix-disc.tmp.iso')) {
            throw 'Read-only inspection unexpectedly left a temporary ISO'
          }
          Remove-Item $cue -Force
          Write-Host 'Read-only FR CUE inspect without BIN: PASS'
          exit 0

      - name: Verify one-click auto-discovery fails safely without a retail CD
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = (Resolve-Path 'target/x86_64-pc-windows-msvc/release/CyberGladiatorsFix.exe').Path
          $dir = Split-Path -Parent $exe
          if (Test-Path (Join-Path $dir 'CyberGladiatorsFix')) {
            throw 'Test runner unexpectedly contains an installed game'
          }
          $text = (& $exe 2>&1 | Out-String)
          if ($LASTEXITCODE -eq 0) {
            throw 'Automatic no-argument launch unexpectedly succeeded without a CD or game'
          }
          if ($text -notmatch 'No installed game') {
            throw "Missing diagnostic for absent retail image: $text"
          }
          if (Test-Path (Join-Path $dir 'CyberGladiatorsFix')) {
            throw 'Automatic installer created a game directory without a valid CD'
          }
          if (!(Test-Path (Join-Path $dir 'CyberGladiatorsFix.log'))) {
            throw 'Automatic launch did not produce its unified session log'
          }
          Write-Host 'One-click auto-discovery no-CD refusal: PASS'
          # The expected native EXE exit was nonzero; reset it explicitly,
          # otherwise pwsh propagates that value despite successful assertions.
          exit 0

      - name: Package one executable and Apache-2.0 notices
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist/CyberGladiatorsFix-PreRelease -Force | Out-Null
          Copy-Item 'target/x86_64-pc-windows-msvc/release/CyberGladiatorsFix.exe' 'dist/CyberGladiatorsFix-PreRelease/CyberGladiatorsFix.exe'
          if (Test-Path 'dist/CyberGladiatorsFix-PreRelease/glide.dll') { throw "One-file distribution must not ship a separate GameFrame glide.dll" }
          Copy-Item 'third_party/game-frame/LICENSE-APACHE' 'dist/CyberGladiatorsFix-PreRelease/LICENSE-APACHE'
          Copy-Item 'LICENSE' 'dist/CyberGladiatorsFix-PreRelease/LICENSE-GPL-3.0'
          Copy-Item 'docs/DISTRIBUTION.md' 'dist/CyberGladiatorsFix-PreRelease/README.txt'
          $release = 'dist/CyberGladiatorsFix-PreRelease'
          # Publish a reproducible byte-level receipt for the exact artifact.
          $checksums = foreach ($name in @('CyberGladiatorsFix.exe', 'LICENSE-APACHE', 'LICENSE-GPL-3.0', 'README.txt')) {
            $digest = (Get-FileHash (Join-Path $release $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $name"
          }
          $checksums | Set-Content (Join-Path $release 'SHA256SUMS.txt') -Encoding ascii
          if ((Get-Content (Join-Path $release 'SHA256SUMS.txt')).Count -ne 4) {
            throw 'Pre-release SHA256SUMS.txt must cover the executable and all three documents'
          }
          $executables = @(Get-ChildItem $release -File | Where-Object { $_.Extension -eq '.exe' -or $_.Extension -eq '.dll' })
          if ($executables.Count -ne 1 -or $executables[0].Name -ne 'CyberGladiatorsFix.exe') {
            throw "One-file distribution must contain exactly one executable and no external DLL"
          }
          Get-FileHash (Join-Path $release 'CyberGladiatorsFix.exe') -Algorithm SHA256 | Format-List | Out-String | Write-Host

      - name: Independently recheck all files and hashes in distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'dist/CyberGladiatorsFix-PreRelease'
          $expected = @('CyberGladiatorsFix.exe','LICENSE-APACHE','LICENSE-GPL-3.0','README.txt','SHA256SUMS.txt') | Sort-Object
          $files = @(Get-ChildItem $root -File | ForEach-Object { $_.Name } | Sort-Object)
          if (@(Compare-Object $expected $files).Count -ne 0) { throw 'Incorrect distribution file list' }
          $rows = @(Get-Content (Join-Path $root 'SHA256SUMS.txt'))
          if ($rows.Count -ne 4) { throw 'Expected exactly four checksum rows' }
          $seen = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          foreach ($line in $rows) {
            if ($line -cmatch '^([0-9a-f]{64})  ([A-Za-z0-9.-]+)
            if ($file -eq 'SHA256SUMS.txt' -or $file -notin $expected -or !$seen.Add($file)) { throw "Unexpected/duplicate file: $file" }
            $measured = (Get-FileHash (Join-Path $root $file) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($measured -cne $hash) { throw "SHA-256 mismatch: $file" }
          }
          if ($seen.Count -ne 4) { throw 'Checksum coverage mismatch' }
          $source = (git rev-parse --short=8 HEAD).Trim()
          $v = (& (Join-Path (Resolve-Path $root).Path 'CyberGladiatorsFix.exe') --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or !$v.EndsWith("-$source")) { throw "Packaged source commit mismatch: $v vs $source" }
          Write-Host 'Candidate distribution independently verified: five files, four hashes, source commit'

      - name: Smoke test native Windows x86 loader (no rendering)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'gameframe-loader-smoke'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item 'third_party/game-frame/wrappers/target/i686-pc-windows-msvc/release/glide2x.dll' (Join-Path $dir 'glide.dll')
          $smoke = Join-Path $dir 'GameFrameGlideSmoke.exe'
          rustc --edition=2021 --target i686-pc-windows-msvc tools/gameframe/smoke_load.rs -o $smoke
          if ($LASTEXITCODE -ne 0) { throw "Cannot compile Windows x86 loader smoke" }
          Push-Location $dir
          try {
            & ".\GameFrameGlideSmoke.exe"
            if ($LASTEXITCODE -ne 0) { throw "Windows x86 load smoke failed" }
          } finally {
            Pop-Location
            Remove-Item -Recurse -Force $dir
          }

      - name: Upload Windows x64 pre-release package
        uses: actions/upload-artifact@v4
        with:
          name: CyberGladiatorsFix-Windows-x64-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'PreRelease' }}
          path: dist/CyberGladiatorsFix-PreRelease/
          if-no-files-found: error
          retention-days: 14
) {
              $hash,$file = $Matches[1],$Matches[2]
            } else {
              throw "Invalid checksum: $line"
            }
            if ($file -eq 'SHA256SUMS.txt' -or $file -notin $expected -or !$seen.Add($file)) { throw "Unexpected/duplicate file: $file" }
            $measured = (Get-FileHash (Join-Path $root $file) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($measured -cne $hash) { throw "SHA-256 mismatch: $file" }
          }
          if ($seen.Count -ne 4) { throw 'Checksum coverage mismatch' }
          $source = (git rev-parse --short=8 HEAD).Trim()
          $v = (& (Join-Path (Resolve-Path $root).Path 'CyberGladiatorsFix.exe') --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or !$v.EndsWith("-$source")) { throw "Packaged source commit mismatch: $v vs $source" }
          Write-Host 'Candidate distribution independently verified: five files, four hashes, source commit'

      - name: Smoke test native Windows x86 loader (no rendering)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'gameframe-loader-smoke'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item 'third_party/game-frame/wrappers/target/i686-pc-windows-msvc/release/glide2x.dll' (Join-Path $dir 'glide.dll')
          $smoke = Join-Path $dir 'GameFrameGlideSmoke.exe'
          rustc --edition=2021 --target i686-pc-windows-msvc tools/gameframe/smoke_load.rs -o $smoke
          if ($LASTEXITCODE -ne 0) { throw "Cannot compile Windows x86 loader smoke" }
          Push-Location $dir
          try {
            & ".\GameFrameGlideSmoke.exe"
            if ($LASTEXITCODE -ne 0) { throw "Windows x86 load smoke failed" }
          } finally {
            Pop-Location
            Remove-Item -Recurse -Force $dir
          }

      - name: Upload Windows x64 pre-release package
        uses: actions/upload-artifact@v4
        with:
          name: CyberGladiatorsFix-Windows-x64-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'PreRelease' }}
          path: dist/CyberGladiatorsFix-PreRelease/
          if-no-files-found: error
          retention-days: 14
