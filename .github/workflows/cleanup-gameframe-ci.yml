name: Cleanup Windows CI run history (legacy and GameFrame)

# Manual-only: delete completed runs from BOTH the former windows.yml and the
# current gameframe-glide.yml. Never touch publication history, tags, releases,
# this cleanup workflow or the branch-cleanup workflow.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only: do not delete anything (recommended first)'
        required: true
        type: boolean
        default: true
      confirmation:
        description: 'To delete, uncheck dry_run and type DELETE-GAMEFRAME-CI-RUNS'
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: cybergladiatorsfix-manual-gameframe-ci-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'legluondunet/CyberGladiatorsFix' && github.ref == 'refs/heads/main'
    name: Preview or delete legacy and GameFrame Windows CI history
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Cleanup only completed historical and current Windows builds
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" != "true" && "$DRY_RUN" != "false" ]]; then
            echo "::error::Invalid dry_run value"
            exit 1
          fi
          if [[ "$DRY_RUN" == "false" && "$CONFIRMATION" != "DELETE-GAMEFRAME-CI-RUNS" ]]; then
            echo "::error::Deletion refused: confirmation must be DELETE-GAMEFRAME-CI-RUNS"
            exit 1
          fi

          # Query all run history: the historical windows.yml no longer exists
          # in the repo and cannot be queried reliably by its workflow filename.
          # Filter by exact stored run.path; no publication/cleanup runs match.
          # Inventory before deleting so deletion cannot shift pagination.
          runs="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed" and (.path == ".github/workflows/windows.yml" or .path == ".github/workflows/gameframe-glide.yml")) | [.id, .path] | @tsv')"

          planned=0
          legacy=0
          gameframe=0
          deleted=0
          if [[ -n "$runs" ]]; then
            while IFS=$'\t' read -r run_id workflow_path; do
              [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "::error::Invalid run ID"; exit 1; }
              case "$workflow_path" in
                .github/workflows/windows.yml) legacy=$((legacy + 1));;
                .github/workflows/gameframe-glide.yml) gameframe=$((gameframe + 1));;
                *) echo "::error::Unexpected workflow path: $workflow_path"; exit 1;;
              esac
              planned=$((planned + 1))
              if [[ "$DRY_RUN" == "true" ]]; then
                echo "PREVIEW: would delete $workflow_path run $run_id"
              else
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" >/dev/null
                deleted=$((deleted + 1))
                echo "DELETED: $workflow_path run $run_id"
                sleep 0.5
              fi
            done <<< "$runs"
          fi

          {
            echo "## Windows CI history cleanup"
            echo ""
            echo "- Targets: windows.yml (legacy) and gameframe-glide.yml"
            echo "- Legacy Windows runs found: $legacy"
            echo "- Current GameFrame runs found: $gameframe"
            echo "- Total completed runs found: $planned"
            echo "- Actually deleted: $deleted"
            echo "- Mode: $([[ "$DRY_RUN" == "true" ]] && echo preview || echo deletion)"
            echo "- Publication and cleanup history, GitHub Releases, tags, sources: untouched"
          } >> "$GITHUB_STEP_SUMMARY"
