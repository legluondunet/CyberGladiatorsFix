name: Windows x64 - build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release EXE
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Run unit tests
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Smoke test command-line version and help
        shell: pwsh
        run: |
          & "target/x86_64-pc-windows-msvc/release/CyberGladiatorsFix.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Version smoke test failed" }
          & "target/x86_64-pc-windows-msvc/release/CyberGladiatorsFix.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "Help smoke test failed" }

      - name: Upload standalone Windows x64 executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CyberGladiatorsFix-Windows-x64
          path: target/x86_64-pc-windows-msvc/release/CyberGladiatorsFix.exe
          if-no-files-found: warn
          retention-days: 30
