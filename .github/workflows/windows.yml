name: Windows - x64 installer + x86 CDDA bridge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc

      - name: Build Windows x86 CDDA bridge DLL
        run: cargo build --release --target i686-pc-windows-msvc --manifest-path cdda/Cargo.toml

      - name: Test Windows x86 CDDA bridge
        run: cargo test --target i686-pc-windows-msvc --manifest-path cdda/Cargo.toml

      - name: Build release EXE
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Run unit tests
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Smoke test command-line version and help
        shell: pwsh
        run: |
          & "target/x86_64-pc-windows-msvc/release/CyberGladiatorsFix.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Version smoke test failed" }
          & "target/x86_64-pc-windows-msvc/release/CyberGladiatorsFix.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "Help smoke test failed" }

      - name: Smoke test one session log and system probe
        shell: pwsh
        run: |
          Push-Location target/x86_64-pc-windows-msvc/release
          try {
            & "./CyberGladiatorsFix.exe" --verify
            if ($LASTEXITCODE -eq 0) { throw "Verify unexpectedly succeeded without a game installation" }
            if (!(Test-Path "CyberGladiatorsFix.log")) { throw "Missing unified session log" }
            $content = Get-Content -Raw "CyberGladiatorsFix.log"
            foreach ($expected in @("[SESSION] BEGIN", "[SYSTEM]", "[HOST]", "[RUNTIME]", "[CONFIG]", "[SESSION] END failure", "DISPLAY=", "Win32_OS=")) {
              if (!$content.Contains($expected)) { throw "Session log missing $expected" }
            }
            $before = (Get-Item "CyberGladiatorsFix.log").LastWriteTimeUtc
            & "./CyberGladiatorsFix.exe" --help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Help smoke test failed" }
            if ((Get-Item "CyberGladiatorsFix.log").LastWriteTimeUtc -ne $before) {
              throw "Help unexpectedly reset the previous session log"
            }
          } finally { Pop-Location }

      - name: Stage Windows launcher, CDDA DLL and isolated x86 intro player
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/CyberGladiatorsFix.exe dist/
          Copy-Item cdda/target/i686-pc-windows-msvc/release/CyberGladiatorsCDDA.dll dist/
          Copy-Item cdda/target/i686-pc-windows-msvc/release/CyberGladiatorsIntro.exe dist/
          Copy-Item CyberGladiatorsFix-Wine.sh dist/
          $player = (Get-Item dist/CyberGladiatorsIntro.exe).Length
          if ($player -lt 4096) { throw "Isolated intro player unexpectedly small" }
          Write-Host "x86 intro player bytes: $player"
          $dll = (Get-Item dist/CyberGladiatorsCDDA.dll).Length
          if ($dll -lt 4096) { throw "CDDA DLL unexpectedly small" }
          Write-Host "CDDA DLL bytes: $dll"
          $dumpbin = Get-ChildItem 'C:/Program Files/Microsoft Visual Studio' -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hostx64[\\/]x86' } | Select-Object -First 1
          if ($dumpbin) { & $dumpbin.FullName /exports dist/CyberGladiatorsCDDA.dll }
          else { Write-Host "dumpbin not on PATH; architecture verified by unit tests" }

      - name: Upload Windows x64 installer and x86 CDDA DLL
        uses: actions/upload-artifact@v4
        with:
          name: CyberGladiatorsFix-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30
